# Lighthouse CI audits the production build that the E2E suite runs against (fake
# Storefront API, served by `vite preview`), so the scores measure the app itself and
# do not move with a third-party API's latency. Locally: `npm run lighthouse`.
ci:
  collect:
    startServerCommand: npm run preview:e2e
    startServerReadyPattern: Local
    # The app uses hash routes and Lighthouse reports a page's URL without the #part,
    # which would pool every page into one result. A label in the query string (ignored
    # by the app) keeps each page's runs, and so its budgets, apart.
    url:
      - http://127.0.0.1:4173/luma-shopify-storefront/
      - http://127.0.0.1:4173/luma-shopify-storefront/?page=catalog#/products
      - http://127.0.0.1:4173/luma-shopify-storefront/?page=product#/products/stoneware-mug
    numberOfRuns: 3
  assert:
    assertions:
      # Mobile emulation on a simulated slow 4G connection; medians were 86 to 91 when set.
      categories:performance: [error, { minScore: 0.8, aggregationMethod: median-run }]
      categories:accessibility: [error, { minScore: 1 }]
      categories:best-practices: [error, { minScore: 1 }]
      categories:seo: [error, { minScore: 1 }]
      cumulative-layout-shift: [error, { maxNumericValue: 0.1, aggregationMethod: median-run }]
  upload:
    # A public link to each report, kept for a few days, printed in the CI log.
    target: temporary-public-storage
