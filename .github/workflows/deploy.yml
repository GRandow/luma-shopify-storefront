name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build storefront
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        # Repository variables (Settings → Secrets and variables → Actions → Variables).
        # Leave them unset to build against Shopify's public mock.shop sandbox.
        env:
          VITE_SHOPIFY_STOREFRONT_API_URL: ${{ vars.VITE_SHOPIFY_STOREFRONT_API_URL }}
          VITE_SHOPIFY_STOREFRONT_TOKEN: ${{ vars.VITE_SHOPIFY_STOREFRONT_TOKEN }}
          VITE_HOSTED_CHECKOUT: ${{ vars.VITE_HOSTED_CHECKOUT }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload production build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
